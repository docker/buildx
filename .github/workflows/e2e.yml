name: e2e

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'v[0-9]*'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'

env:
  SETUP_BUILDX_VERSION: "edge"
  SETUP_BUILDKIT_IMAGE: "moby/buildkit:latest"
  DESTDIR: "./bin"
  K3S_VERSION: "v1.32.2+k3s1"

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.SETUP_BUILDX_VERSION }}
          driver-opts: image=${{ env.SETUP_BUILDKIT_IMAGE }}
          buildkitd-flags: --debug
      -
        name: Build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          targets: binaries
          set: |
            *.platform=linux/amd64,windows/amd64
            *.cache-from=type=gha,scope=release
            *.cache-from=type=gha,scope=binaries
            *.cache-to=type=gha,scope=binaries
      -
        name: Rename binaries
        run: |
          mv ${{ env.DESTDIR }}/build/linux_amd64/buildx ${{ env.DESTDIR }}/build/linux_amd64/docker-buildx
          mv ${{ env.DESTDIR }}/build/windows_amd64/buildx.exe ${{ env.DESTDIR }}/build/windows_amd64/docker-buildx.exe
      -
        name: Upload Linux artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary
          path: ${{ env.DESTDIR }}/build/linux_amd64
          if-no-files-found: error
          retention-days: 7
      -
        name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-windows
          path: ${{ env.DESTDIR }}/build/windows_amd64
          if-no-files-found: error
          retention-days: 7

  windows-docker:
    runs-on: windows-2025
    needs:
      - build
    timeout-minutes: 30
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Install buildx
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-windows
          path: ~/.docker/cli-plugins
      -
        name: Set up Windows Docker daemon
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: type=image,tag=master # TODO: Replace master with 29.10+ for the Windows runtime binaries added in https://github.com/moby/moby/pull/54069.
          context: windows-smoke
          daemon-config: |
            {
              "debug": true,
              "features": {
                "embedded-containerd": true,
                "containerd-snapshotter": true,
                "buildkit": true
              }
            }
      -
        name: Test Windows Docker builder
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const {randomUUID} = require('node:crypto');

            const dockerContext = 'windows-smoke';
            const testDir = path.join(process.env.GITHUB_WORKSPACE, '.dev', 'windows-docker-' + randomUUID());
            const image = 'buildx-windows-smoke:' + randomUUID();
            const docker = async (...args) => {
              const {stdout} = await exec.getExecOutput('docker', ['--context', dockerContext, ...args]);
              return stdout.trim();
            };
            await fs.mkdir(testDir, {recursive: true});

            try {
              const version = await docker('buildx', 'version');
              assert.equal(version.split(/\s+/)[2], process.env.GITHUB_SHA, 'Unexpected Buildx revision');
              assert.equal(await docker('info', '--format', '{{.OSType}}'), 'windows', 'Expected a Windows Docker daemon');

              // Context builders must be discovered without buildx create.
              const builders = (await docker('buildx', 'ls', '--format', 'json')).split(/\r?\n/).map(line => JSON.parse(line));
              const matches = builders.filter(builder => builder.Name === dockerContext);
              assert.equal(matches.length, 1, 'Expected the Windows context builder');
              assert.equal(matches[0].Driver, 'docker', 'Expected the docker driver');
              const node = matches[0].Nodes[0];
              assert.equal(node.Status, 'running', 'Expected a running Windows worker');
              assert.ok(node.Platforms.some(platform => /^windows(\([^)]*\))?\/amd64/.test(platform)), 'Expected a Windows platform');
              await docker('buildx', 'inspect', dockerContext);

              await fs.writeFile(path.join(testDir, 'Dockerfile'), [
                'FROM mcr.microsoft.com/windows/nanoserver:ltsc2025',
                'USER ContainerAdministrator',
                'WORKDIR C:/smoke',
                'COPY message.txt .',
                'RUN type message.txt > result.txt',
                'CMD ' + JSON.stringify(['cmd', '/S', '/C', 'type C:\\smoke\\result.txt']),
                '',
              ].join('\n'));
              await fs.writeFile(path.join(testDir, 'message.txt'), 'buildx-windows-ok\n');

              // No --load: the docker driver must load into this daemon automatically.
              await docker('buildx', 'build', '--builder', dockerContext, '--progress', 'plain', '-t', image, testDir);
              assert.equal(await docker('image', 'inspect', '--format', '{{.Os}}', image), 'windows', 'Expected a Windows image in the daemon image store');
              assert.equal(await docker('run', '--rm', image), 'buildx-windows-ok', 'Unexpected container output');
            } finally {
              // Keep the test inputs and daemon build cache for diagnosing failures.
              await exec.exec('docker', ['--context', dockerContext, 'image', 'rm', '-f', image], {ignoreReturnCode: true})
                .catch(error => core.warning('Image cleanup failed: ' + error.message));
            }

  driver:
    runs-on: ubuntu-26.04
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        driver:
          - docker
          - docker-container
          - kubernetes
          - remote
        buildkit:
          - moby/buildkit:buildx-stable-1
          - moby/buildkit:master
        buildkit-cfg:
          - bkcfg-false
          - bkcfg-true
        multi-node:
          - mnode-false
          - mnode-true
        platforms:
          - linux/amd64
          - linux/amd64,linux/arm64
        include:
          - driver: kubernetes
            driver-opt: qemu.install=true
          - driver: remote
            endpoint: tcp://localhost:1234
          - driver: docker-container
            metadata-provenance: max
          - driver: docker-container
            metadata-warnings: true
        exclude:
          - driver: docker
            multi-node: mnode-true
          - driver: docker
            buildkit-cfg: bkcfg-true
          - driver: docker-container
            multi-node: mnode-true
          - driver: remote
            multi-node: mnode-true
          - driver: remote
            buildkit-cfg: bkcfg-true
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.driver == 'docker' || matrix.driver == 'docker-container'
      -
        name: Install buildx
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary
          path: /home/runner/.docker/cli-plugins
      -
        name: Fix perms and check
        run: |
          chmod +x /home/runner/.docker/cli-plugins/docker-buildx
          docker buildx version
      -
        name: Init env vars
        run: |
          # BuildKit cfg
          if [ "${{ matrix.buildkit-cfg }}" = "bkcfg-true" ]; then
            cat > "/tmp/buildkitd.toml" <<EOL
          [worker.oci]
            max-parallelism = 2
          EOL
            echo "BUILDKIT_CFG=/tmp/buildkitd.toml" >> $GITHUB_ENV
          fi
          # Multi node
          if [ "${{ matrix.multi-node }}" = "mnode-true" ]; then
            echo "MULTI_NODE=1" >> $GITHUB_ENV
          else
            echo "MULTI_NODE=0" >> $GITHUB_ENV
          fi
          if [ -n "${{ matrix.metadata-provenance }}" ]; then
            echo "BUILDX_METADATA_PROVENANCE=${{ matrix.metadata-provenance }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ matrix.metadata-warnings }}" ]; then
            echo "BUILDX_METADATA_WARNINGS=${{ matrix.metadata-warnings }}" >> $GITHUB_ENV
          fi
      -
        name: Install k3s
        if: matrix.driver == 'kubernetes'
        uses: crazy-max/.github/.github/actions/install-k3s@f91220cba053bd54299ba645a599ee8ed436f222 # v1.11.0
        with:
          version: ${{ env.K3S_VERSION }}
      -
        name: Launch remote buildkitd
        if: matrix.driver == 'remote'
        run: |
          docker run -d \
            --privileged \
            --name=remote-buildkit \
            -p 1234:1234 \
            ${{ matrix.buildkit }} \
            --addr unix:///run/buildkit/buildkitd.sock \
            --addr tcp://0.0.0.0:1234
      -
        name: Test
        run: |
          make test-driver
        env:
          BUILDKIT_IMAGE: ${{ matrix.buildkit }}
          DRIVER: ${{ matrix.driver }}
          DRIVER_OPT: ${{ matrix.driver-opt }}
          ENDPOINT: ${{ matrix.endpoint }}
          PLATFORMS: ${{ matrix.platforms }}

  bake:
    runs-on: ubuntu-26.04
    needs:
      - build
    env:
      DOCKER_BUILD_CHECKS_ANNOTATIONS: false
      DOCKER_BUILD_SUMMARY: false
    strategy:
      fail-fast: false
      matrix:
        include:
          -
            # https://github.com/docker/bake-action/blob/v5.11.0/.github/workflows/ci.yml#L227-L237
            source: "https://github.com/docker/bake-action.git#v5.11.0:test/go"
            overrides: |
              *.output=/tmp/bake-build
          -
            # https://github.com/tonistiigi/xx/blob/2fc85604e7280bfb3f626569bd4c5413c43eb4af/.github/workflows/ld.yml#L90-L98
            source: "https://github.com/tonistiigi/xx.git#2fc85604e7280bfb3f626569bd4c5413c43eb4af"
            targets: |
              ld64-static-tgz
            overrides: |
              ld64-static-tgz.output=type=local,dest=./dist
              ld64-static-tgz.platform=linux/amd64
              ld64-static-tgz.cache-from=type=gha,scope=xx-ld64-static-tgz
              ld64-static-tgz.cache-to=type=gha,scope=xx-ld64-static-tgz
          -
            # https://github.com/moby/buildkit-bench/blob/54c194011c4fc99a94aa75d4b3d4f3ffd4c4ce27/docker-bake.hcl#L154-L160
            source: "https://github.com/moby/buildkit-bench.git#54c194011c4fc99a94aa75d4b3d4f3ffd4c4ce27"
            targets: |
              tests-buildkit
            envs: |
              BUILDKIT_REFS=v0.18.2
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      -
        name: Environment variables
        if: matrix.envs != ''
        run: |
          for l in "${{ matrix.envs }}"; do
            echo "${l?}" >> $GITHUB_ENV
          done
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      -
        name: Install buildx
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary
          path: /home/runner/.docker/cli-plugins
      -
        name: Fix perms and check
        run: |
          chmod +x /home/runner/.docker/cli-plugins/docker-buildx
          docker buildx version
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.SETUP_BUILDKIT_IMAGE }}
          buildkitd-flags: --debug
      -
        name: Build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: ${{ matrix.source }}
          targets: ${{ matrix.targets }}
          set: ${{ matrix.overrides }}
